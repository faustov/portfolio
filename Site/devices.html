<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0d12;
    --ink: #f4f5f7;
    --muted: #9aa0aa;
    --accent: #3d8bd4;
    --panel: rgba(22, 26, 34, .72);
    --line: rgba(255, 255, 255, .1);
  }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative; min-height: 100vh; overflow: hidden;
    display: grid; place-items: center;
    background: radial-gradient(60% 50% at 50% 55%, #1b2a40 0%, var(--bg) 70%);
  }
  /* Device switch at the top of the hero */
  .topbar {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3;
    max-width: calc(100vw - 32px); padding: 4px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    font-size: 14px;
  }
  .topbar .segmented { border: 0; padding: 0; }
  .topbar .segmented button { padding: 7px 16px; }

  /* .device is only the framing box (where the device sits at rest); the canvas covers the
     whole hero so close-ups can run off the edges of the window instead of being clipped */
  .device { position: relative; width: min(100vw, 900px); height: min(80vh, 780px); margin-top: 8vh; pointer-events: none; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s; z-index: 1; }
  .device .still {
    position: absolute; left: 50%; top: 50%; width: 30%; transform: translate(-50%, -50%);
    border-radius: 22%; transition: opacity .4s;
  }
  .hero.ready #stage { opacity: 1; }
  .hero.ready .still { opacity: 0; }
  .hero.loading #stage { opacity: .25; }

  /* Animation controls */
  .controls {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 3;
    width: min(calc(100vw - 32px), 780px);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 12px 14px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    font-size: 13px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; width: 100%; }
  .presets { display: flex; flex-wrap: wrap; gap: 4px; }
  .segmented { display: inline-flex; padding: 2px; border-radius: 999px; border: 1px solid var(--line); }
  .segmented button { border: 0 !important; }
  .presets button, .segmented button, .btn {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; padding: 6px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .presets button[aria-pressed="true"], .segmented button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .segmented button { padding: 5px 12px; font-weight: 600; }
  .divider { width: 1px; align-self: stretch; background: var(--line); }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-width: 76px; justify-content: center; }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .field input[type=range] { width: 110px; accent-color: var(--accent); }
  .field output { color: var(--ink); min-width: 34px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }

  footer { padding: 32px 16px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.7; }
  footer a { color: inherit; }
</style>

/* ------------------------------------------------------------------ *
 * Timeline helpers.
 * Each property (rx/ry/rz in degrees, y in model-radius units, zoom,
 * f = focus on the preset's target 0..1) is its own keyframe track:
 * [time (s), value, easing into this key].
 * ------------------------------------------------------------------ */
const ease = {
  linear: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
const DEFAULTS = { rx: 0, ry: 0, rz: 0, y: 0, zoom: 1, f: 0 };

function sample(track, t) {
  if (!track) return undefined;
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) {
    const [t1, v1, e = 'inOut'] = track[i];
    if (t <= t1) {
      const [t0, v0] = track[i - 1];
      return v0 + (v1 - v0) * ease[e]((t - t0) / (t1 - t0));
    }
  }
  return track[track.length - 1][1];
}
function pose(preset, t) {
  const out = {};
  for (const k in DEFAULTS) out[k] = sample(preset.tracks[k], t) ?? DEFAULTS[k];
  return out;
}

      { mesh: 'Back_Screen',  image: 'assets/fold-cover.png', flipY: false, placeholder: [1000, 1446], label: 'Cover screen',
        blur: { crease: 0, side: 1, from: -0.1, to: 0.9, maxLod: 6, minShade: 0.35, creaseShadow: 0 } },
    ],
    fit: 1.0,
    fold: { clip: 'open-close' },   // clip time 0 s = open, 1 s = 90°, 2 s = closed
    presets: FOLD_PRESETS,
    targets: ({ onScreen }) => ({
      inner: onScreen(0.5, 0.5, 0, 0),   // inner screen, measured open
      cover: onScreen(0.5, 0.5, 1, 1),   // cover screen, measured closed
    }),
    settings: { preset: 'unfold', fold: 0, speed: 1, repeat: false, float: true, follow: true, glare: 0 },
    look:  { maxDeg: 10, depth: 3, reach: 2, smooth: 1.75 },
    float: { y: 0.012, rx: 0.47, rz: 0.33 },
  },
};

/* ------------------------------------------------------------------ *
 * Shared scene
 * ------------------------------------------------------------------ */
const wrap = document.querySelector('.hero');        // canvas covers the whole hero
const frame = document.getElementById('device');     // framing box for the device at rest
const canvas = document.getElementById('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FOV = 12;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.8); fill.position.set(-3, 1, -2); scene.add(fill);
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 1000);

// Safari: GLTFLoader decodes textures with createImageBitmap, which in Safari sometimes
// yields empty bitmaps (model renders black / invisible, only our <img>-loaded screen shows).
// Without createImageBitmap GLTFLoader falls back to plain <img> decoding, which is reliable.
const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
if (isSafari) globalThis.createImageBitmap = undefined;
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const texLoader = new THREE.TextureLoader();

function placeholderTexture([w, h], label = 'Your UI here') {
  const c = document.createElement('canvas');
  c.width = w / 2; c.height = h / 2;
  const x = c.getContext('2d'), m = Math.min(c.width, c.height);
  const g = x.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0, '#1d2a3f'); g.addColorStop(1, '#0c1018');
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = 'rgba(255,255,255,.85)';
  x.textAlign = 'center';
  x.font = `600 ${m * 0.075}px -apple-system, Helvetica, Arial`;
  x.fillText(label, c.width / 2, c.height / 2);
  x.fillStyle = 'rgba(255,255,255,.45)';
  x.font = `400 ${m * 0.045}px -apple-system, Helvetica, Arial`;
  x.fillText(`${w} × ${h}`, c.width / 2, c.height / 2 + m * 0.08);
  return new THREE.CanvasTexture(c);
}

/* Looping muted video as a screen texture. Mipmaps are regenerated every frame
 * so the fold blur (which samples smaller mip levels) works on video too. */
function videoTexture(url) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    Object.assign(v, { src: url, muted: true, loop: true, playsInline: true, autoplay: true, preload: 'auto' });
    v.setAttribute('playsinline', '');
    v.addEventListener('loadeddata', () => {
      v.play().catch(() => {});
      const tex = new THREE.VideoTexture(v);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      resolve(tex);
    }, { once: true });
    v.addEventListener('error', () => reject(new Error('video ' + url)), { once: true });
  });
}

/* Fold blur: as the device folds, the half of the screen that turns away gets
 * blurred (sampled from a smaller mip level, with bicubic filtering so it stays
 * smooth instead of blocky) and darkened. Same idea as Apple's iPhone Duo viewer.
 * Drive it with mesh.userData.wipe.value (0 = sharp, 1 = full effect). */
const FOLD_BLUR_GLSL = /* glsl */`
uniform float uWipe, uCrease, uSide, uFrom, uTo, uMaxLod, uMinShade, uCreaseShadow;
float bw0(float a) { return (1.0/6.0)*(a*(a*(-a + 3.0) - 3.0) + 1.0); }
float bw1(float a) { return (1.0/6.0)*(a*a*(3.0*a - 6.0) + 4.0); }
float bw2(float a) { return (1.0/6.0)*(a*(a*(-3.0*a + 3.0) + 3.0) + 1.0); }
float bw3(float a) { return (1.0/6.0)*(a*a*a); }
// Cubic B-spline sample of one mip level, 4 bilinear taps
vec4 bicubicLevel(sampler2D tex, vec2 uv, float lod) {
  vec2 size = vec2(textureSize(tex, int(lod)));
  vec2 st = uv * size - 0.5;
  vec2 i = floor(st), f = fract(st);
  vec2 g0 = vec2(bw0(f.x) + bw1(f.x), bw0(f.y) + bw1(f.y));
  vec2 g1 = vec2(bw2(f.x) + bw3(f.x), bw2(f.y) + bw3(f.y));
  vec2 h0 = vec2(-1.0 + bw1(f.x) / g0.x, -1.0 + bw1(f.y) / g0.y);
  vec2 h1 = vec2( 1.0 + bw3(f.x) / g1.x,  1.0 + bw3(f.y) / g1.y);
  vec2 p0 = (i + h0 + 0.5) / size, p1 = (i + h1 + 0.5) / size;
  return g0.y * (g0.x * textureLod(tex, p0, lod) + g1.x * textureLod(tex, vec2(p1.x, p0.y), lod))
       + g1.y * (g0.x * textureLod(tex, vec2(p0.x, p1.y), lod) + g1.x * textureLod(tex, p1, lod));
}
vec4 textureBlur(sampler2D tex, vec2 uv, float lod) {
  if (lod < 0.01) return texture(tex, uv);
  return mix(bicubicLevel(tex, uv, floor(lod)), bicubicLevel(tex, uv, ceil(lod)), fract(lod));
}
`;
function addFoldBlur(mesh, { crease = 0.5, side = 1, from = 0, to = 0.5, maxLod = 6.5, minShade = 0.3, creaseShadow = 0 } = {}) {
  const u = {
    uWipe: { value: 0 }, uCrease: { value: crease }, uSide: { value: side },
    uFrom: { value: from }, uTo: { value: to },
    uMaxLod: { value: maxLod }, uMinShade: { value: minShade }, uCreaseShadow: { value: creaseShadow },
  };
  mesh.userData.wipe = u.uWipe;
  mesh.material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, u);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\n' + FOLD_BLUR_GLSL)
      .replace('#include <emissivemap_fragment>', /* glsl */`
        #ifdef USE_EMISSIVEMAP
          // signed distance from the hinge line, positive towards the blurred side
          float sd = (vEmissiveMapUv.x - uCrease) * uSide;
          float area = smoothstep(uFrom, uTo, sd) * uWipe;
          float lod = pow(area, 0.75) * uMaxLod;
          float shade = mix(1.0, uMinShade, smoothstep(0.0, 1.0, area));
          // soft shadow right along the crease while it bends
          shade *= 1.0 - uCreaseShadow * uWipe * (1.0 - smoothstep(0.0, 0.06, abs(vEmissiveMapUv.x - uCrease)));
          totalEmissiveRadiance *= textureBlur(emissiveMap, vEmissiveMapUv, lod).rgb * shade;
        #endif`);
  };
  mesh.material.customProgramCacheKey = () => 'fold-blur';
}

/* Build a "rig" per device: pivot > inner > centred model, screens, fold, targets */
const rigs = {}, rigLoads = {};
function loadRig(id) {
  // Cache the promise so a preload and a click never load the same model twice
  return (rigLoads[id] ??= buildRig(id));
}
async function buildRig(id) {
  const d = DEVICES[id];
  const [gltf, ...texes] = await Promise.all([
    loader.loadAsync(d.model),
    ...d.screens.map(sc => (sc.video ? videoTexture(sc.video) : texLoader.loadAsync(sc.image))
      .catch(() => placeholderTexture(sc.placeholder, sc.label))),
  ]);
  const model = gltf.scene;

  // Our UI on each screen
  const screens = d.screens.map((sc, i) => {
    const tex = texes[i];
    tex.flipY = sc.flipY;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.needsUpdate = true;
    const mesh = model.getObjectByName(sc.mesh);
    mesh.material = mesh.material.clone();
    // A Standard material always keeps a 4% specular highlight from the lights; Physical lets
    // setGlare() scale specular all the way to 0, so Glare 0 = no reflection at all
    if (!mesh.material.isMeshPhysicalMaterial) {
      const phys = new THREE.MeshPhysicalMaterial();
      THREE.MeshStandardMaterial.prototype.copy.call(phys, mesh.material);
      phys.defines = { STANDARD: '', PHYSICAL: '' };
      mesh.material = phys;
    }
    mesh.userData.clearcoat = mesh.material.clearcoat ?? 0;
    Object.assign(mesh.material, { emissiveMap: tex, emissiveIntensity: 1, toneMapped: false, metalness: 0 });
    mesh.material.emissive.set(0xffffff);
    if (sc.blur) addFoldBlur(mesh, sc.blur);
    mesh.material.needsUpdate = true;
    return mesh;
  });

  // Fold animation: kept paused, we scrub its time (0..1 → open..closed)
  let setFold = null;
  if (d.fold) {
    const mixer = new THREE.AnimationMixer(model);
    const clip = THREE.AnimationClip.findByName(gltf.animations, d.fold.clip);
    const action = mixer.clipAction(clip);
    action.play(); action.paused = true;
    setFold = v => { action.time = THREE.MathUtils.clamp(v, 0, 1) * clip.duration; mixer.update(0); };
    setFold(0);
  }
  const precise = !!d.fold;   // skinned meshes need per-vertex bounds

  // Face the first screen to the camera (+Z), then centre the model
  model.updateMatrixWorld(true);
  const mb = new THREE.Box3().setFromObject(model, precise);
  const sb = new THREE.Box3().setFromObject(screens[0], precise);
  const faceDir = sb.getCenter(new THREE.Vector3()).sub(mb.getCenter(new THREE.Vector3())).normalize();
  model.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(faceDir, new THREE.Vector3(0, 0, 1)));
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model, precise);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  const inner = new THREE.Group();   // re-centres the model as it folds
  const pivot = new THREE.Group();   // timeline + float + cursor rotation
  inner.add(model); pivot.add(inner);
  pivot.visible = false;
  scene.add(pivot);

  // Sample the fold: pose centre + radius, to re-centre and re-frame while folding
  const N = 20, samples = [];
  const measure = () => {
    pivot.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(model, precise);
    return { c: b.getCenter(new THREE.Vector3()), r: b.getSize(new THREE.Vector3()).length() / 2 };
  };
  if (setFold) { for (let i = 0; i <= N; i++) { setFold(i / N); samples.push(measure()); } setFold(0); }
  else samples.push(measure());
  const sampleAt = v => {
    if (samples.length === 1) return samples[0];
    const x = THREE.MathUtils.clamp(v, 0, 1) * N, i = Math.min(N - 1, Math.floor(x)), f = x - i;
    return { c: samples[i].c.clone().lerp(samples[i + 1].c, f), r: THREE.MathUtils.lerp(samples[i].r, samples[i + 1].r, f) };
  };

  // Focus targets in pivot space, measured at a given fold and relative to that pose's centre.
  // onScreen(u, v, screenIndex, fold): u 0→1 left→right, v 0→1 bottom→top
  const atFold = (fold, fn) => {
    if (setFold) setFold(fold);
    pivot.updateMatrixWorld(true);
    const pt = fn().sub(sampleAt(fold).c);
    if (setFold) setFold(0);
    return pt;
  };
  const onScreen = (u, v, i = 0, fold = 0) => atFold(fold, () => {
    const b = new THREE.Box3().setFromObject(screens[i], precise);
    return new THREE.Vector3(
      THREE.MathUtils.lerp(b.min.x, b.max.x, u),
      THREE.MathUtils.lerp(b.min.y, b.max.y, v),
      b.max.z);
  });
  const find = (test, fold = 0) => atFold(fold, () => {
    const b = new THREE.Box3();
    model.traverse(o => { if (o.isMesh && test(o)) b.expandByObject(o, precise); });
    return b.isEmpty() ? new THREE.Vector3() : b.getCenter(new THREE.Vector3());
  });

  // Compile shaders and upload textures before the rig is ever shown, so the first frame
  // doesn't stall (Safari compiles shaders slowly) or show half-initialised materials
  // (taken out of the scene meanwhile, so the render loop can't draw it half-ready)
  scene.remove(pivot); pivot.visible = true;
  try { await renderer.compileAsync(pivot, camera, scene); } catch (e) { console.warn(e); }
  pivot.visible = false; scene.add(pivot);
  model.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) for (const v of Object.values(m))
      if (v && v.isTexture && !v.isVideoTexture) renderer.initTexture(v);
  });

  return (rigs[id] = {
    id, pivot, inner, model, screens, setFold, sampleAt,
    radius: samples[0].r,
    targets: d.targets({ onScreen, find }),
    baseDist: 1,
  });
}

function setGlare(rig, v) {
  // Screen materials are near-perfect mirrors; 0 = matte, 1 = original gloss
  for (const m of rig.screens) {
    m.material.envMapIntensity = v;
    m.material.roughness = THREE.MathUtils.lerp(0.6, 0.001, v);
    // envMapIntensity doesn't touch highlights from the scene lights: scale specular itself,
    // otherwise a grey veil stays (and the bent crease catches a light streak)
    if ('specularIntensity' in m.material) m.material.specularIntensity = v;
    if ('clearcoat' in m.material) m.material.clearcoat = m.userData.clearcoat * v;
  }
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // Shift the projection so the scene origin lands on the centre of the framing box
  const cr = canvas.getBoundingClientRect(), fr = frame.getBoundingClientRect();
  const dx = (fr.left + fr.width / 2) - (cr.left + w / 2);
  const dy = (fr.top + fr.height / 2) - (cr.top + h / 2);
  camera.setViewOffset(w, h, -dx, -dy, w, h);
  camera.updateProjectionMatrix();
  if (!rig) return;
  // Fit the device to the framing box (not the whole canvas): angular size of the box
  const t = Math.tan(THREE.MathUtils.degToRad(FOV) / 2);
  const fovV = 2 * Math.atan(t * fr.height / h);
  const fovH = 2 * Math.atan(t * fr.width / h);
  rig.baseDist = (rig.radius * DEVICES[rig.id].fit) / Math.sin(Math.min(fovV, fovH) / 2);
  camera.near = rig.baseDist / 100; camera.far = rig.baseDist * 10;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ------------------------------------------------------------------ *
 * Per-device playback state (each device keeps its own settings)
 * ------------------------------------------------------------------ */
const states = {};
for (const [id, d] of Object.entries(DEVICES)) {
  states[id] = {
    ...d.settings, t: 0, floatT: 0, playing: !reduceMotion, look: { x: 0, y: 0 },
    fold: d.settings.fold ?? 0, foldCur: d.settings.fold ?? 0, foldManual: false,
  };
}
let deviceId = 'watch';
let rig = null;
const S = () => states[deviceId];
const P = () => DEVICES[deviceId].presets[S().preset];

const $ = id => document.getElementById(id);
const deviceBar = $('devices'), presetBar = $('presets'), foldBar = $('folds');

for (const id of ['iphone', 'fold', 'watch']) {      // order of the top switch
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = DEVICES[id].label; b.dataset.id = id;
  b.onclick = () => selectDevice(id);
  deviceBar.append(b);
}

// Fold switch, like the Xcode simulator's device posture
const FOLD_STATES = [['Open', 0], ['Half', 0.5], ['Closed', 1]];
for (const [label, v] of FOLD_STATES) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.dataset.v = v;
  b.onclick = () => { const s = S(); s.fold = v; s.foldManual = true; syncFoldUI(); };
  foldBar.append(b);
}
function syncFoldUI() {
  foldBar.hidden = !DEVICES[deviceId].fold;
  for (const b of foldBar.children) b.setAttribute('aria-pressed', Math.abs(S().fold - +b.dataset.v) < 0.01);
}

function buildPresetBar() {
  presetBar.replaceChildren();
  for (const [id, p] of Object.entries(DEVICES[deviceId].presets)) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = p.label; b.title = p.note; b.dataset.id = id;
    b.onclick = () => selectPreset(id);
    presetBar.append(b);
  }
}

function syncUI() {
  const s = S();
  for (const b of deviceBar.children) b.setAttribute('aria-pressed', b.dataset.id === deviceId);
  for (const b of presetBar.children) b.setAttribute('aria-pressed', b.dataset.id === s.preset);
  $('play').textContent = s.playing ? '⏸ Stop' : '▶ Play';
  $('play').setAttribute('aria-pressed', s.playing);
  $('repeat').setAttribute('aria-pressed', s.repeat);
  $('float').setAttribute('aria-pressed', s.float);
  $('follow').setAttribute('aria-pressed', s.follow);
  $('speed').value = s.speed;
  $('speedOut').textContent = s.speed.toFixed(2).replace(/\.?0+$/, '') + '×';
  $('glare').value = s.glare;
  $('glareOut').textContent = Math.round(s.glare * 100) + '%';
  syncFoldUI();
}

let switchToken = 0;
async function selectDevice(id) {
  const token = ++switchToken;
  deviceId = id;
  buildPresetBar(); syncUI();
  wrap.classList.add('loading');
  const next = await loadRig(id);
  if (token !== switchToken) return;               // user switched again while loading
  if (rig) rig.pivot.visible = false;
  rig = next;
  rig.pivot.visible = true;
  setGlare(rig, S().glare);
  // Restart the device's animation from the top when switching to it
  S().t = 0; S().playing = !reduceMotion; S().foldManual = false; syncUI();
  resize();
  wrap.classList.remove('loading');
}

function selectPreset(id) {
  const s = S();
  s.preset = id; s.t = 0; s.playing = true; s.foldManual = false;
  if (P().seamless) s.repeat = true;               // looping presets only make sense with repeat on
  syncUI();
}
function setPlaying(v) {
  const s = S(), p = P();
  if (v && !s.playing && s.t >= p.duration + p.hold) { s.t = 0; s.foldManual = false; }   // Play on a finished one-shot restarts it
  s.playing = v; syncUI();
}

$('play').onclick = () => setPlaying(!S().playing);
$('repeat').onclick = () => { S().repeat = !S().repeat; syncUI(); };
$('float').onclick = () => { S().float = !S().float; syncUI(); };
$('follow').onclick = () => { S().follow = !S().follow; syncUI(); };
$('speed').oninput = e => { S().speed = +e.target.value; syncUI(); };
$('glare').oninput = e => { S().glare = +e.target.value; if (rig) setGlare(rig, S().glare); syncUI(); };

/* ------------------------------------------------------------------ *
 * Cursor follow: the screen turns a little to face the cursor.
 * Aim = angle to be perpendicular to a cursor hovering `depth` radii in
 * front of the page; influence fades with distance from the device;
 * exponential smoothing turns fast flicks into a soft turn.
 * ------------------------------------------------------------------ */
const pointer = { x: 0, y: 0, active: false };
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
}, { passive: true });
document.documentElement.addEventListener('pointerleave', () => { pointer.active = false; });
addEventListener('blur', () => { pointer.active = false; });

const qLook = new THREE.Quaternion(), eLook = new THREE.Euler(), _c = new THREE.Vector3();
function updateLook(dt, zoom) {
  const s = S(), L = DEVICES[deviceId].look, look = s.look;
  let tx = 0, ty = 0;
  if (s.follow && pointer.active && !reduceMotion) {
    const rect = canvas.getBoundingClientRect();
    _c.copy(rig.pivot.position).project(camera);
    const cx = rect.left + (_c.x + 1) / 2 * rect.width;
    const cy = rect.top + (1 - _c.y) / 2 * rect.height;
    const rPx = (rect.height / 2) * rig.radius /
      ((rig.baseDist / zoom) * Math.tan(THREE.MathUtils.degToRad(FOV) / 2));
    const dx = (pointer.x - cx) / rPx, dy = (pointer.y - cy) / rPx;
    const w = 1 / (1 + 4 * (Math.hypot(dx, dy) / L.reach) ** 2);
    const cap = THREE.MathUtils.degToRad(L.maxDeg);
    ty = THREE.MathUtils.clamp(Math.atan(dx / L.depth) * w, -cap, cap);
    tx = THREE.MathUtils.clamp(Math.atan(dy / L.depth) * w, -cap, cap);
  }
  const a = 1 - Math.exp(-dt * L.smooth);
  look.x += (tx - look.x) * a;
  look.y += (ty - look.y) * a;
  qLook.setFromEuler(eLook.set(look.x, look.y, 0, 'YXZ'));
}

/* ------------------------------------------------------------------ *
 * Loop
 * ------------------------------------------------------------------ */
let visible = true;
new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(wrap);

const d2r = THREE.MathUtils.degToRad;
const clock = new THREE.Clock();
const _v = new THREE.Vector3();
const FOLD_SMOOTH = 3.5;   // Open/Half/Closed switch: higher = faster; 3.5 ≈ settles in ~1 s
let first = true;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!rig || (!visible && !first)) return;

  const s = S(), p = P(), F = DEVICES[deviceId].float;
  if (s.playing) {
    s.t += dt * s.speed;
    s.floatT += dt * s.speed;
    const end = p.duration + p.hold;
    if (s.t >= end) {
      if (s.repeat) { s.t = p.seamless ? s.t % p.duration : 0; s.foldManual = false; }
      else { s.t = end; if (!s.float) setPlaying(false); }
    }
  }
  const t = p.seamless ? s.t % p.duration : s.t;
  const k = reduceMotion ? pose(p, p.duration) : pose(p, t);
  let zoom = k.zoom;

  // Fold: driven by the preset's fold track, or eased towards the panel switch
  if (rig.setFold) {
    const track = p.tracks.fold;
    if (track && !s.foldManual) {
      const v = reduceMotion ? track[track.length - 1][1] : sample(track, t);
      if (Math.abs(v - s.fold) > 1e-4) { s.fold = v; syncFoldUI(); }
      s.foldCur = v;
    } else {
      s.foldCur += (s.fold - s.foldCur) * (reduceMotion ? 1 : 1 - Math.exp(-dt * FOLD_SMOOTH));
    }
    rig.setFold(s.foldCur);
    // Screen blur only while the hinge is moving: follows fold speed, eased so it fades out smoothly
    const vel = dt > 0 ? Math.abs(s.foldCur - (s.foldPrev ?? s.foldCur)) / dt : 0;
    s.foldPrev = s.foldCur;
    const wipeTarget = reduceMotion ? 0 : THREE.MathUtils.smoothstep(vel, 0.05, 0.5);
    s.wipe = (s.wipe ?? 0) + (wipeTarget - (s.wipe ?? 0)) * (1 - Math.exp(-dt * 7));
    for (const m of rig.screens) if (m.userData.wipe) m.userData.wipe.value = s.wipe;
    const smp = rig.sampleAt(s.foldCur);
    rig.inner.position.copy(smp.c).negate();               // keep the pose centred
    zoom *= THREE.MathUtils.lerp(1, rig.radius / smp.r, 0.75);   // folded = smaller, so frame closer
  }

  // Levitation layer
  let fy = 0, frx = 0, frz = 0;
  if (s.float && !reduceMotion) {
    fy = Math.sin(s.floatT * 1.6) * F.y;
    frx = Math.sin(s.floatT * 1.1 + 1) * F.rx;
    frz = Math.sin(s.floatT * 0.8) * F.rz;
  }

  const pivot = rig.pivot;
  pivot.rotation.set(d2r(k.rx + frx), d2r(k.ry), d2r(k.rz + frz));
  updateLook(dt, zoom);                            // cursor look, in camera space
  pivot.quaternion.premultiply(qLook);

  pivot.position.set(0, (k.y + fy) * rig.radius, 0);
  if (p.target && k.f > 0) {                       // centre the (rotated) detail
    _v.copy(rig.targets[p.target]).applyQuaternion(pivot.quaternion);
    pivot.position.addScaledVector(_v, -k.f);
  }
  camera.position.set(0, 0, rig.baseDist / zoom);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  if (first) { wrap.classList.add('ready'); first = false; }
});

await selectDevice('watch');
// Warm the other devices in the background, one after another (parallel loads slow the first one down)
loadRig('iphone').then(() => loadRig('fold')).catch(console.warn);

window.__stage = { scene, camera, rigs, states, DEVICES, get rig() { return rig; }, get device() { return deviceId; }, selectDevice };
</script>
</body>
</html>
