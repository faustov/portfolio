<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif">
  <rect width="800" height="280" fill="#e9e9e6"/>

  <!-- Bottom slice of the phone: bezel + screen -->
  <path d="M40 40 H760 V180 a60 60 0 0 1 -60 60 H100 a60 60 0 0 1 -60 -60 Z" fill="#1d1d1b"/>
  <path d="M52 40 H748 V178 a50 50 0 0 1 -50 50 H102 a50 50 0 0 1 -50 -50 Z" fill="#fff"/>
  <rect x="52" y="40" width="696" height="1.5" fill="#e4e4e0"/>

  <g fill="none" stroke="#8a8a8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Watchlist -->
    <g transform="translate(122 84)">
      <rect x="-22" y="-26" width="44" height="52" rx="7"/>
      <path d="M-11 -10 H11 M-11 2 H11 M-11 14 H3"/>
    </g>
    <!-- Chart -->
    <g transform="translate(261 84)">
      <rect x="-25" y="-25" width="50" height="50" rx="11"/>
      <path d="M-14 9 L-4 -3 L4 5 L14 -9"/>
    </g>
    <!-- Ideas -->
    <g transform="translate(539 84)">
      <path d="M-11 12 C-11 4 -21 0 -21 -9 A21 21 0 0 1 21 -9 C21 0 11 4 11 12 Z"/>
      <path d="M-9 22 H9 M-5 30 H5"/>
    </g>
    <!-- Menu -->
    <g transform="translate(678 84)">
      <path d="M-22 -14 H22 M-22 0 H22 M-22 14 H22"/>
    </g>
  </g>

  <!-- Explore: active, filled compass -->
  <g transform="translate(400 84)">
    <circle r="29" fill="#131722"/>
    <path d="M13 -13 L4 4 L-13 13 L-4 -4 Z" fill="#fff"/>
    <circle r="3.6" fill="#131722"/>
  </g>

  <g font-size="21" text-anchor="middle" fill="#8a8a8a" font-weight="500">
    <text x="122" y="146">Watchlist</text>
    <text x="261" y="146">Chart</text>
    <text x="400" y="146" fill="#131722" font-weight="600">Explore</text>
    <text x="539" y="146">Ideas</text>
    <text x="678" y="146">Menu</text>
  </g>

  <!-- Home indicator -->
  <rect x="320" y="208" width="160" height="10" rx="5" fill="#131722"/>
</svg>
